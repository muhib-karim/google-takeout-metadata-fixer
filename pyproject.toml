# Tooling configuration only; the scripts are run directly with `python <script>.py`.

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "exiftool: calls the real exiftool binary (skipped when it is not installed)",
]
